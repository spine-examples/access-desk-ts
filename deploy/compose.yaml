#
# Access Desk on a developer's machine.
#
# Run it from the repository root, with the settings of the `.env` there:
#
#   docker compose --env-file .env --file deploy/compose.yaml ...
#
name: access-desk

services:
  # The PostgreSQL server, where the programs reach it: at
  # ACCESS_DESK_DATABASE_HOST and _PORT, with the account the settings name.
  # It makes the databases the settings name with `postgres/initdb/`, when it
  # first starts.
  postgres:
    # The newest PostgreSQL the Spine adapter was accepted against.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${ACCESS_DESK_DATABASE_USER:?Set ACCESS_DESK_DATABASE_USER in .env.}
      POSTGRES_PASSWORD: ${ACCESS_DESK_DATABASE_PASSWORD:?Set ACCESS_DESK_DATABASE_PASSWORD in .env.}
      POSTGRES_DB: postgres
      # The databases to make.
      ACCESS_DESK_IDENTITY_DATABASE: ${ACCESS_DESK_IDENTITY_DATABASE:?Set ACCESS_DESK_IDENTITY_DATABASE in .env.}
      ACCESS_DESK_ORGANIZATIONS: ${ACCESS_DESK_ORGANIZATIONS:?Set ACCESS_DESK_ORGANIZATIONS in .env.}
      ACCESS_DESK_ORGANIZATION_DATABASE: ${ACCESS_DESK_ORGANIZATION_DATABASE:?Set ACCESS_DESK_ORGANIZATION_DATABASE in .env.}
      ACCESS_DESK_RESOURCES_SUBSCRIPTIONS_DATABASE: ${ACCESS_DESK_RESOURCES_SUBSCRIPTIONS_DATABASE:?Set ACCESS_DESK_RESOURCES_SUBSCRIPTIONS_DATABASE in .env.}
      ACCESS_DESK_GATEWAY_DATABASE: ${ACCESS_DESK_GATEWAY_DATABASE:?Set ACCESS_DESK_GATEWAY_DATABASE in .env.}
    ports:
      - target: 5432
        host_ip: ${ACCESS_DESK_DATABASE_HOST:?Set ACCESS_DESK_DATABASE_HOST in .env.}
        published: ${ACCESS_DESK_DATABASE_PORT:?Set ACCESS_DESK_DATABASE_PORT in .env.}
    volumes:
      # PostgreSQL 18 images keep their data under this directory.
      - data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, which the server takes only once it has made its first
      # databases, not over the socket it opens while it makes them.
      test:
        ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=$${POSTGRES_USER} --dbname=postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  data:
