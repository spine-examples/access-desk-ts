syntax = "proto3";

package accessdesk.resources.scheduling;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "accessdesk/resources/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// One schedulable command, scheduled to run at a specified time.
message Scheduling {
  option (entity).kind = PROCESS_MANAGER;
  option (entity).visibility = FULL;

  // The scheduled command.
  accessdesk.resources.ScheduledCommandId id = 1;

  // The command to run.
  google.protobuf.Any command = 2 [(required) = true];

  // When the command is due.
  google.protobuf.Timestamp due = 3 [(required) = true];
}
