syntax = "proto3";

package accessdesk.resources.scheduling;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "accessdesk/resources/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// The scheduling of one command for a set time.
//
// A process requests that a command be scheduled for its due time.
// Only a command declared as schedulable is accepted.
//
message Scheduling {
  option (entity).kind = PROCESS_MANAGER;
  option (entity).visibility = FULL;

  // Identifies the scheduled command. The process that schedules the command
  // chooses the identifier.
  accessdesk.resources.ScheduledCommandId id = 1;

  // The scheduled command, packed with its type.
  google.protobuf.Any command = 2 [(required) = true];

  // The moment the command is scheduled for.
  google.protobuf.Timestamp due = 3 [(required) = true];
}
