syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/identity/identifiers.proto";
import "accessdesk/identity/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Registers a person as a member of an organization, by their email address.
message RegisterMember {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1;

    // The organization the person joins.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];

    // The role the person will hold in the organization.
    accessdesk.identity.OrganizationRole role = 3 [(required) = true];

    // The organization administrator who registers the person.
    //
    // This field is empty when the person is the first organization
    // administrator.
    //
    accessdesk.identity.PersonId registered_by = 4;
}

// Resolves the email address of a registration to the person it belongs to, as
// a member of the registration's organization.
//
message ResolveMember {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1;
}
