syntax = "proto3";

package accessdesk.resources.organization.invitation;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An organization's invitation of one person to become its member.
message Invitation {
    option (entity).kind = PROCESS_MANAGER;

    // The invited person, by their email address.
    accessdesk.resources.InvitationId id = 1;

    // The role the invited person will hold in the organization once they
    // accept.
    accessdesk.resources.OrganizationRole role = 2 [(required) = true];

    // The status of the invitation.
    accessdesk.resources.InvitationStatus status = 3 [(required) = true];
}

// An invitation specifying the role it grants and the person who accepted it.
message InvitationView {
    option (entity).kind = PROJECTION;
    option (entity).visibility = FULL;

    // The invited person, by their email address.
    accessdesk.resources.InvitationId id = 1;

    // The role the invitation gives the invited person.
    accessdesk.resources.OrganizationRole role = 2 [(required) = true];

    // The current status of the invitation.
    accessdesk.resources.InvitationStatus status = 3 [(required) = true];

    // The person who accepted the invitation.
    accessdesk.identity.PersonId accepted_by = 4;
}
