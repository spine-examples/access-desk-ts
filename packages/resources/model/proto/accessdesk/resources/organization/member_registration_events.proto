syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/identity/identifiers.proto";
import "accessdesk/identity/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An organization administrator started registering a person as a member of an
// organization, by their email address.
//
message MemberRegistrationStarted {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The organization the person joins.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];

    // The role the person will hold in the organization.
    accessdesk.identity.OrganizationRole role = 3 [(required) = true];
}

// The email address was resolved to the person it belongs to, as a member of
// the organization.
//
message MemberResolved {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The organization the person is a member of.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];

    // The person the address belongs to.
    accessdesk.identity.PersonId person = 3 [(required) = true];
}

// A person was registered as a member of an organization, by their email
// address.
//
message MemberRegistered {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The organization the person belongs to from now on.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];

    // The person the address belongs to.
    accessdesk.identity.PersonId person = 3 [(required) = true];

    // The role the person holds in the organization.
    accessdesk.identity.OrganizationRole role = 4 [(required) = true];

    // The organization administrator who registered the person.
    accessdesk.identity.PersonId registered_by = 5 [(required) = true];
}

// The person under the email address could not be registered as a member of
// the organization, as another organization claimed them already.
//
message MemberRegistrationFailed {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The organization the person was to be registered in.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];
}
