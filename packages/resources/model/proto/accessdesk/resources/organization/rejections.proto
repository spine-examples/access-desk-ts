syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/net/email_address.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An organization that already exists.
message OrganizationAlreadyExists {

    // The organization's ID.
    accessdesk.identity.OrganizationId id = 1 [(required) = true, (validate) = true];
}

// A resource name already used in the organization.
message OrganizationResourceNameAlreadyUsed {

    // The resource that could not be added.
    accessdesk.resources.ResourceId resource_id = 1 [(required) = true];

    // The name already in use.
    string name = 2 [(required) = true];
}

// The person is a member of the organization already.
message MemberAlreadyAdded {

    // The organization's ID.
    accessdesk.identity.OrganizationId id = 1 [(required) = true, (validate) = true];

    // The person who is a member already.
    accessdesk.identity.PersonId person = 2 [(required) = true];

    // The email address the person was to be added under.
    spine.net.EmailAddress email_address = 3 [(required) = true];
}
