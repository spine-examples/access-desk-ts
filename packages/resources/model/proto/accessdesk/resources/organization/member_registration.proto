syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/identity/identifiers.proto";
import "accessdesk/identity/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// The registration of a person as a member of an organization, by their email
// address.
//
// 1. An organization administrator registers the person under the address with
//    a role.
// 2. The person under the address is claimed as a member of the organization.
// 3. The organization lists the person among its members.
//
message MemberRegistration {
    option (entity).kind = PROCESS_MANAGER;

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1;

    // The organization the person is registered in.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];

    // The person, once they are registered as a member of the organization.
    accessdesk.identity.PersonId person = 3;

    // The role the person holds in the organization.
    accessdesk.identity.OrganizationRole role = 4 [(required) = true];

    // The organization administrator who registers the person.
    //
    // This field is empty for the organization's first administrator.
    //
    accessdesk.identity.PersonId registered_by = 5;
}
