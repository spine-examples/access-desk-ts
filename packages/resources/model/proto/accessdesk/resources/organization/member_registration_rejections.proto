syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// The person under the email address is a member of the organization already.
message MemberAlreadyRegistered {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The organization the person belongs to.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];

    // The person the address belongs to.
    accessdesk.identity.PersonId person = 3 [(required) = true];
}

// Another organization claimed the person under the email address already,
// so this one cannot.
message MemberOfOtherOrganization {

    // The member registration's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The organization the address was to be registered in.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];
}
