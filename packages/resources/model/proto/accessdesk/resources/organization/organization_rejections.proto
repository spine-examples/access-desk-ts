syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An organization that already exists.
message OrganizationAlreadyExists {

  // The organization that already exists.
  accessdesk.resources.OrganizationId id = 1 [(required) = true];
}

// A person who is already a member of an organization.
message OrganizationMemberAlreadyAdded {

  // The organization where the person is already a member.
  accessdesk.resources.OrganizationId organization_id = 1 [(required) = true];

  // The person who is already a member.
  accessdesk.identity.PersonId person = 2 [(required) = true];
}

// A resource name already reserved by a different resource in this organization.
message OrganizationResourceNameAlreadyUsed {

  // The resource whose organization recording was refused.
  accessdesk.resources.ResourceId resource_id = 1 [(required) = true];

  // The already-reserved resource name.
  string name = 2 [(required) = true];
}
