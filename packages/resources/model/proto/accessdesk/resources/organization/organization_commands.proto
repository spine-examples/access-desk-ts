syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Establishes a new organization within which resources are owned and access to
// them is granted.
//
// The organization is its own tenant: the command is issued in that tenant's
// scope, so `id` and the command's `TenantId` carry the same value.
//
message CreateOrganization {

  // The identifier of the organization to create.
  accessdesk.resources.OrganizationId id = 1;

  // The human-readable organization name, unique across organizations and
  // compared case-insensitively.
  string name = 2 [(required) = true];
}

// Adds a person as a member of an organization.
message AddOrganizationMember {

  // The organization whose membership changes.
  accessdesk.resources.OrganizationId organization_id = 1;

  // The person to add as a member.
  accessdesk.identity.PersonId person = 2 [(required) = true];

  // The member's display name.
  string name = 3 [(required) = true];
}

// Records a newly created resource as one of an organization's resources.
message AddResource {

  // The organization the resource belongs to.
  accessdesk.resources.OrganizationId organization_id = 1;

  // The resource being recorded.
  accessdesk.resources.ResourceId resource_id = 2 [(required) = true];

  // The resource's display name.
  string name = 3 [(required) = true];
}
