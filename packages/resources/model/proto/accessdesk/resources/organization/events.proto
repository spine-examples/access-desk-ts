syntax = "proto3";

package accessdesk.resources.organization;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An organization was created.
message OrganizationCreated {

  // The identifier of the created organization.
  accessdesk.resources.OrganizationId id = 1 [(required) = true];

  // The human-readable organization name, unique across organizations and
  // compared case-insensitively.
  string name = 2 [(required) = true];
}

// A person was added as a member of an organization.
message OrganizationMemberAdded {
  // The organization that owns this membership.
  accessdesk.resources.OrganizationId organization_id = 1 [(required) = true];

  // The person added as a member.
  accessdesk.identity.PersonId person = 2 [(required) = true];

  // The member's display name.
  string name = 3 [(required) = true];
}

// A resource was added to an organization.
message ResourceAdded {

  // The organization that owns the resource.
  accessdesk.resources.OrganizationId organization_id = 1 [(required) = true];

  // The resource that was added.
  accessdesk.resources.ResourceId resource_id = 2 [(required) = true];

  // The resource's display name.
  string name = 3 [(required) = true];
}
