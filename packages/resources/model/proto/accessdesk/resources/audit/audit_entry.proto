syntax = "proto3";

package accessdesk.resources.audit;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "accessdesk/resources/identifiers.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An entry in an organization's audit trail.
//
// It records one action the organization accepted: who took it, when, on
// which resource, and everything the action stated, such as the reason a
// request was denied. An entry is never changed.
//
message AuditEntry {
    option (entity).kind = PROJECTION;
    option (entity).visibility = FULL;

    // The entry's ID.
    accessdesk.resources.AuditEntryId id = 1;

    // When the action was taken.
    google.protobuf.Timestamp when = 2 [(required) = true, (column) = true];

    // The person who took the action.
    //
    // For an action that followed from another, such as access being
    // granted on approval, it is the person who took the first one.
    //
    accessdesk.identity.PersonId actor = 3 [(required) = true, (column) = true];

    // The resource the action concerns, when it concerns one.
    accessdesk.resources.ResourceId resource = 4 [(column) = true];

    // The action, as the organization recorded it.
    google.protobuf.Any event = 5 [(required) = true];
}
