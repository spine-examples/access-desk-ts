syntax = "proto3";

package accessdesk.resources;

import "google/protobuf/any.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Identifies an organization.
message OrganizationId {

  string uuid = 1 [(required) = true];
}

// Identifies a resource within exactly one organization.
message ResourceId {

  string uuid = 1 [(required) = true];
}

// Identifies an access request.
message AccessRequestId {

  string uuid = 1 [(required) = true];
}

// Identifies an access grant.
message AccessGrantId {

  string uuid = 1 [(required) = true];
}

// Identifies the access one person holds to one resource.
message GrantCoverageId {

  // The person holding the access.
  accessdesk.identity.PersonId grantee = 1 [(required) = true];

  // The resource the access applies to.
  ResourceId resource = 2 [(required) = true];
}

// Identifies one command scheduled to run at a set time.
message ScheduledCommandId {

  string uuid = 1 [(required) = true];
}

// Identifies a message invoker.
//
// Stores a packed ID and the type of the entity
// that triggered the first command or event in the flow.
//
// Useful for routing events back to the invoker
// after completion of a flow that may be initiated
// from different places.
//
message InvokerId {

  // The packed invoker ID.
  google.protobuf.Any id = 1 [(required) = true];

  // The type of the invoker.
  string type = 2 [(required) = true];
}
