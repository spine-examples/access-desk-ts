syntax = "proto3";

package accessdesk.resources.resource;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// A protected system, dataset, or tool that people request access to.
message Resource {
  option (entity).kind = AGGREGATE;

  // The resource identifier.
  accessdesk.resources.ResourceId id = 1;

  // The resource's display name, unique within its organization and compared
  // case-insensitively.
  string name = 2;

  // A human-readable summary of what the resource is.
  string description = 3;

  // The catalog category the resource.
  string category = 4;

  // The rules that govern access to the resource.
  accessdesk.resources.ResourcePolicy policy = 5;
}

// A resource listed with its access policy.
message ResourceCatalogItem {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // The resource identifier.
  accessdesk.resources.ResourceId id = 1;

  // The resource's display name, unique within its organization.
  string name = 2 [(required) = true, (column) = true];

  // A human-readable summary of what the resource is.
  string description = 3 [(required) = true];

  // The catalog category the resource.
  string category = 4 [(required) = true];

  // The rules that govern access to the resource.
  accessdesk.resources.ResourcePolicy policy = 5 [(required) = true];
}
