syntax = "proto3";

package accessdesk.resources.resource;

import "google/protobuf/duration.proto";
import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Registers a resource in an organization.
message RegisterResource {

  // The identifier for the resource.
  accessdesk.resources.ResourceId id = 1;

  // The organization the resource belongs to.
  accessdesk.resources.OrganizationId organization_id = 2;

  // The requested resource display name, unique within the organization and
  // compared case-insensitively.
  string name = 3 [(required) = true];

  // The human-readable resource description.
  string description = 4 [(required) = true];

  // The catalog category the resource belongs to.
  string category = 5 [(required) = true];

  // The data-sensitivity classification of the resource.
  accessdesk.resources.Sensitivity sensitivity = 6 [(required) = true];

  // The people who manage the resource; at least one is required.
  repeated accessdesk.identity.PersonId manager = 7 [(required) = true];

  // The access levels offered by this resource, ordered from weakest to strongest.
  repeated accessdesk.resources.AccessLevel access_level = 8 [(required) = true, (validate) = true];

  // The maximum permitted access duration, at one-minute granularity.
  google.protobuf.Duration maximum_duration = 9 [(required) = true];
}
