syntax = "proto3";

package accessdesk.resources.resource;

import "google/protobuf/duration.proto";
import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Creates a resource with its complete initial policy, closed to requests.
message CreateResource {

  // The resource identifier.
  accessdesk.resources.ResourceId id = 1;

  // The resource's display name, unique within the organization and compared
  // case-insensitively.
  string name = 2 [(required) = true];

  // The human-readable resource description.
  string description = 3 [(required) = true];

  // The catalog category the resource belongs to.
  string category = 4 [(required) = true];

  // The data-sensitivity classification of the resource.
  accessdesk.resources.Sensitivity sensitivity = 5 [(required) = true];

  // The people who manage the resource; at least one is required.
  repeated accessdesk.identity.PersonId manager = 6 [(required) = true];

  // The access levels offered by this resource, ordered from weakest to strongest.
  repeated accessdesk.resources.AccessLevel access_level = 7 [(required) = true, (validate) = true];

  // The maximum permitted access duration, at one-minute granularity.
  google.protobuf.Duration maximum_duration = 8 [(required) = true];
}

// Deletes a resource that must be removed from its organization.
message DeleteResource {

  // The resource to delete.
  accessdesk.resources.ResourceId id = 1;
}

// Opens a resource to new access requests.
message OpenResourceForRequests {

  // The resource to open.
  accessdesk.resources.ResourceId id = 1;
}

// Closes a resource to new access requests.
message CloseResourceForRequests {

  // The resource to close.
  accessdesk.resources.ResourceId id = 1;
}
