syntax = "proto3";

package accessdesk.resources.resource;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// A resource was created with its complete initial policy.
message ResourceCreated {

  // The created resource.
  accessdesk.resources.ResourceId id = 1 [(required) = true];

  // The resource's display name, unique within the organization and compared
  // case-insensitively.
  string name = 2 [(required) = true];

  // The resource description.
  string description = 3 [(required) = true];

  // The catalog category.
  string category = 4 [(required) = true];

  // The complete resource policy established at creation.
  accessdesk.resources.ResourcePolicy policy = 5 [(required) = true];
}

// A resource was deleted and can no longer receive access requests.
message ResourceDeleted {

  // The resource that was deleted.
  accessdesk.resources.ResourceId id = 1 [(required) = true];
}

// A resource was opened to new access requests.
message ResourceOpenedForRequests {

  // The resource whose policy changed.
  accessdesk.resources.ResourceId id = 1 [(required) = true];

  // The complete current resource policy.
  accessdesk.resources.ResourcePolicy policy = 2 [(required) = true];
}

// A resource was closed to new access requests.
message ResourceClosedForRequests {

  // The resource whose policy changed.
  accessdesk.resources.ResourceId id = 1 [(required) = true];

  // The complete current resource policy.
  accessdesk.resources.ResourcePolicy policy = 2 [(required) = true];
}
