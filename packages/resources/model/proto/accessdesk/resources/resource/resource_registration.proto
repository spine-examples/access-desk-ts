syntax = "proto3";

package accessdesk.resources.resource;

import "google/protobuf/duration.proto";
import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// The registration of a new resource in an organization.
//
// 1. A member registers the resource, and the request is remembered here.
// 2. The resource is created with the requested policy.
// 3. The created resource is recorded among the organization's resources.
// 4. If the organization rejects the name, the created resource is deleted.
// 5. The process emits a registration result and is deleted after the resource
//    is recorded or deleted.
//
message ResourceRegistration {
  option (entity).kind = PROCESS_MANAGER;

  // The resource being entered into the organization's registry.
  accessdesk.resources.ResourceId id = 1;

  // The organization the resource will belong to.
  accessdesk.resources.OrganizationId organization_id = 2;

  // The requested resource name.
  string name = 3;

  // The requested resource description.
  string description = 4;

  // The requested resource category.
  string category = 5;

  // The requested data-sensitivity classification.
  accessdesk.resources.Sensitivity sensitivity = 6;

  // The requested resource managers.
  repeated accessdesk.identity.PersonId manager = 7;

  // The requested access levels.
  repeated accessdesk.resources.AccessLevel access_level = 8;

  // The requested maximum access duration.
  google.protobuf.Duration maximum_duration = 9;
}
