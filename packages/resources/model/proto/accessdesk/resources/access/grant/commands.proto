syntax = "proto3";

package accessdesk.resources.access.grant;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Creates an access grant from an approved request.
message CreateAccessGrant {

  // The grant identifier.
  accessdesk.resources.AccessGrantId id = 1;

  // The approved request that issues the grant.
  accessdesk.resources.AccessRequestId request = 2 [(required) = true];

  // The access the grant confers.
  accessdesk.resources.GrantedAccess access = 3 [(required) = true, (validate) = true];

  // The inclusive start of the access.
  google.protobuf.Timestamp start = 4 [(required) = true];

  // The exclusive end of the access.
  google.protobuf.Timestamp end = 5 [(required) = true];

  // The longest the access may last in total, extensions included.
  google.protobuf.Duration maximum_lifetime = 6 [(required) = true];

  // The manager who approved the request.
  accessdesk.identity.PersonId approved_by = 7 [(required) = true];

  // The resource managers who may revoke the grant.
  repeated accessdesk.identity.PersonId manager = 8 [(required) = true];
}

// Activates a grant whose access is due to begin.
//
// Can be scheduled, so that it is sent when the access is due to begin.
//
message ActivateAccessGrant {
  option (is).ts_type = "SchedulableCommand";

  // The grant to activate.
  accessdesk.resources.AccessGrantId id = 1;
}

// Ends an active grant at its planned end.
//
// Can be scheduled, so that it is sent when the access is due to end.
//
message ExpireAccessGrant {
  option (is).ts_type = "SchedulableCommand";

  // The grant to expire.
  accessdesk.resources.AccessGrantId id = 1;
}

// Ends a grant before its planned end.
message RevokeAccessGrant {

  // The grant to revoke.
  accessdesk.resources.AccessGrantId id = 1;

  // The manager revoking the grant.
  accessdesk.identity.PersonId manager = 2 [(required) = true];

  // The business reason for revoking the grant.
  string reason = 3 [(required) = true];
}

// Moves the end of an active grant as an approved extension request proposed.
message ExtendAccessGrant {

  // The grant to extend.
  accessdesk.resources.AccessGrantId id = 1;

  // The approved extension request.
  accessdesk.resources.AccessRequestId request = 2 [(required) = true];

  // The new exclusive end of the access.
  google.protobuf.Timestamp end = 3 [(required) = true];
}
