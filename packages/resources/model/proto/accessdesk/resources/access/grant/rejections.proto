syntax = "proto3";

package accessdesk.resources.access.grant;

import "accessdesk/resources/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// The grant does not confer active access, so it cannot be changed this way.
message AccessGrantNotActive {

  accessdesk.resources.AccessGrantId id = 1;
}

// The person is not a manager of the resource the grant applies to.
message NotResourceManager {

  accessdesk.resources.AccessGrantId id = 1;
}

// The grant no longer waits for its access to begin: the access is already
// active, or has ended.
message AccessGrantNotPending {

  accessdesk.resources.AccessGrantId id = 1;
}
