syntax = "proto3";

package accessdesk.resources.access.grant;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Access a person holds to a resource, issued from an approved request and held
// from its start until it expires or is revoked.
message AccessGrant {
  option (entity).kind = AGGREGATE;

  // The grant identifier.
  accessdesk.resources.AccessGrantId id = 1;

  // The approved request that issued the grant.
  accessdesk.resources.AccessRequestId request = 2 [(required) = true];

  // The access the grant confers.
  accessdesk.resources.GrantedAccess access = 3 [(required) = true];

  // The inclusive start of the access.
  google.protobuf.Timestamp start = 4 [(required) = true];

  // The exclusive end of the access.
  google.protobuf.Timestamp end = 5 [(required) = true];

  // The longest the access may last in total.
  google.protobuf.Duration maximum_lifetime = 6 [(required) = true];

  // The manager who approved the issuing request.
  accessdesk.identity.PersonId approved_by = 7 [(required) = true];

  // The resource managers who may revoke the grant.
  repeated accessdesk.identity.PersonId manager = 8 [(required) = true];

  // The grant status.
  accessdesk.resources.AccessGrantStatus status = 9 [(required) = true];
}

// An access grant as its grantee and the resource's managers see it.
message AccessGrantView {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // The grant identifier.
  accessdesk.resources.AccessGrantId id = 1;

  // The person who holds the access.
  accessdesk.identity.PersonId grantee = 2 [(required) = true, (column) = true];

  // The resource the access applies to.
  accessdesk.resources.ResourceId resource = 3 [(required) = true, (column) = true];

  // The access level held.
  accessdesk.resources.AccessLevel access_level = 4 [(required) = true];

  // The inclusive start of the access.
  google.protobuf.Timestamp start = 5 [(required) = true];

  // The exclusive end of the access.
  google.protobuf.Timestamp end = 6 [(required) = true];

  // The grant status.
  accessdesk.resources.AccessGrantStatus status = 7 [(required) = true];

  // The approved request that authorized the access.
  accessdesk.resources.AccessRequestId request = 8 [(required) = true];
}

// The access a person holds, or is about to hold, to one resource.
message GrantCoverage {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // The person holding the access, and the resource it applies to.
  accessdesk.resources.GrantCoverageId id = 1;

  // The grants that confer the access.
  repeated CoveringGrant grant = 2;

  // A grant that confers, or is about to confer, access to the resource.
  message CoveringGrant {

    // The grant that confers the access to the person.
    accessdesk.resources.AccessGrantId id = 1 [(required) = true];

    // The access level the grant confers.
    accessdesk.resources.AccessLevel access_level = 2 [(required) = true];

    // The inclusive start of the access.
    google.protobuf.Timestamp start = 3 [(required) = true];

    // The exclusive end of the access.
    google.protobuf.Timestamp end = 4 [(required) = true];
  }
}
