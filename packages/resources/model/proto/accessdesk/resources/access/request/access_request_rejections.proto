syntax = "proto3";

package accessdesk.resources.access.request;

import "accessdesk/resources/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// The requested resource is not open for requests.
message ResourceNotRequestable {

  accessdesk.resources.AccessRequestId id = 1;
}

// The requested access level is not offered by the resource.
message AccessLevelNotAvailable {

  accessdesk.resources.AccessRequestId id = 1;
}

// The requested duration exceeds the resource's maximum.
message AccessDurationTooLong {

  accessdesk.resources.AccessRequestId id = 1;
}

// A conflicting request for the same requester and resource is already pending.
message DuplicateAccessRequest {

  accessdesk.resources.AccessRequestId id = 1;
}

// The request has already reached a terminal decision.
message RequestAlreadyDecided {

  accessdesk.resources.AccessRequestId id = 1;
}

// The person is not one of the request's eligible managers.
message ManagerNotEligible {

  accessdesk.resources.AccessRequestId id = 1;
}
