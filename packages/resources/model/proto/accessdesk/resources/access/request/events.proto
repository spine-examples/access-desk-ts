syntax = "proto3";

package accessdesk.resources.access.request;

import "accessdesk/resources/identifiers.proto";
import "accessdesk/resources/values.proto";
import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An access request was accepted for a manager decision.
message AccessRequestSubmitted {

  // The submitted request.
  accessdesk.resources.AccessRequestId id = 1 [(required) = true];

  // The request details.
  accessdesk.resources.AccessRequestSnapshot snapshot = 2 [(required) = true];

  // The resource managers who may decide the request.
  repeated accessdesk.identity.PersonId manager = 3 [(required) = true];
}

// An access-extension request was accepted for a manager decision.
message AccessExtensionRequestSubmitted {

  // The submitted extension request.
  accessdesk.resources.AccessRequestId id = 1 [(required) = true];

  // The request details.
  accessdesk.resources.AccessRequestSnapshot snapshot = 2 [(required) = true];

  // The resource managers who may decide the request.
  repeated accessdesk.identity.PersonId manager = 3 [(required) = true];
}

// A request was approved.
message AccessRequestApproved {

  // The approved request.
  accessdesk.resources.AccessRequestId id = 1 [(required) = true];

  // The request details.
  accessdesk.resources.AccessRequestSnapshot snapshot = 2 [(required) = true];

  // The manager who approved the request.
  accessdesk.identity.PersonId decided_by = 3 [(required) = true];

  // The managers responsible for the request.
  repeated accessdesk.identity.PersonId manager = 4 [(required) = true];
}

// A request was denied for a business reason.
message AccessRequestDenied {

  // The denied request.
  accessdesk.resources.AccessRequestId id = 1 [(required) = true];

  // The request details.
  accessdesk.resources.AccessRequestSnapshot snapshot = 2 [(required) = true];

  // The manager who denied the request.
  accessdesk.identity.PersonId decided_by = 3 [(required) = true];

  // The business reason for denial.
  string reason = 4 [(required) = true];

  // The managers responsible for the request.
  repeated accessdesk.identity.PersonId manager = 5 [(required) = true];
}

// A request was canceled by its requester.
message AccessRequestCanceled {

  // The canceled request.
  accessdesk.resources.AccessRequestId id = 1 [(required) = true];

  // The request details.
  accessdesk.resources.AccessRequestSnapshot snapshot = 2 [(required) = true];

  // The managers responsible for the request.
  repeated accessdesk.identity.PersonId manager = 3 [(required) = true];
}
