syntax = "proto3";

package access_desk.resources;

import "access_desk/resources/identifiers.proto";
import "access_desk/resources/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.resources";

// A protected internal source - a system, dataset, or tool - that people
// request access to.
//
// It belongs to one organization, and its policy governs who
// may access it, at what level, and for how long.
//
message Resource {
  option (entity).kind = AGGREGATE;

  // Identifies the resource within its organization.
  ResourceId id = 1 [(validate) = true, (set_once) = true];

  // The resource's name, unique within its organization.
  string name = 2;

  // A human-readable summary of what the resource is.
  string description = 3;

  // The catalogue category the resource is listed under.
  string category = 4;

  // The rules that govern access to the resource.
  ResourcePolicy policy = 5;
}

// A resource as it appears in its organization's access catalogue: what it is
// and the access rules currently in force for it.
//
message ResourceCatalogueItem {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // Identifies the resource within its organization.
  ResourceId id = 1 [(validate) = true, (set_once) = true];

  // The resource's name; queryable so a name can be looked up for uniqueness.
  string name = 2 [(required) = true, (column) = true];

  // A human-readable summary of what the resource is.
  string description = 3 [(required) = true];

  // The catalogue category the resource is listed under.
  string category = 5 [(required) = true];

  // The rules that govern access to the resource.
  ResourcePolicy policy = 6 [(required) = true];
}
