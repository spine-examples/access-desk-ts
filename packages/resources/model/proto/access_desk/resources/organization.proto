syntax = "proto3";

package access_desk.resources;

import "access_desk/resources/identifiers.proto";
import "access_desk/resources/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.resources";

// An organization that owns resources and within which its members request and
// are granted access to them.
//
// Each organization is a self-contained boundary:
// its members, resources, and access decisions never cross into another.
//
message Organization {
  option (entity).kind = AGGREGATE;

  // Identifies the organization.
  OrganizationId id = 1 [(validate) = true, (set_once) = true];

  // The organization's display name, unique across organizations and compared
  // case-insensitively.
  string name = 2 [(required) = true];

  // The people who belong to the organization.
  repeated OrganizationMember membership = 3;

  // The resources the organization owns.
  repeated OrganizationResource resource = 4;
}

// An organization together with its members and owned resources, as seen by
// catalogue queries.
//
message OrganizationView {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // Identifies the organization.
  OrganizationId id = 1 [(validate) = true, (set_once) = true];

  // The organization's display name, unique across organizations and compared
  // case-insensitively.
  string name = 2 [(required) = true, (column) = true];

  // The people who belong to the organization, each with their current
  // membership status.
  repeated OrganizationMember member = 3;

  // The resources the organization owns.
  repeated OrganizationResource resource = 4;
}
