syntax = "proto3";

package access_desk.resources;

import "google/protobuf/duration.proto";
import "access_desk/resources/identifiers.proto";
import "access_desk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.resources";

// A person's membership in an organization.
message OrganizationMember {

  // The person who belongs to the organization.
  access_desk.identity.PersonId person = 1 [(required) = true, (validate) = true];

  // The member's display name.
  string name = 2 [(required) = true];

  // Whether the person is currently an active member.
  bool active = 3;

  // The monotonically increasing revision of this person's membership activity.
  uint64 membership_version = 4 [(min).value = "1"];
}

// A resource owned by an organization.
message OrganizationResource {

  // The owned resource.
  ResourceId id = 1 [(required) = true, (validate) = true];

  // The resource's display name.
  string name = 2 [(required) = true];
}

// A named degree of access that one resource grants.
//
// Access levels are resource-specific: each resource defines its own levels and
// their ordering. They are ranked only against the other levels of the same
// resource, from weakest to strongest, which supports same-or-stronger checks.
//
message AccessLevel {

  // The level's name, unique within its resource and compared
  // case-insensitively - for example "Viewer", "Contributor", or "Administrator".
  //
  string name = 1 [(required) = true];

  // The level's strength within its resource; a higher rank is stronger.
  //
  // Ranks are meaningful only among one resource's own levels and impose no
  // ordering across resources.
  //
  uint32 rank = 2 [(min).value = "1"];

  // A plain description of what the level permits, shown when a requester
  // chooses a level.
  //
  string description = 3;
}

// The rules that govern access to a resource.
message ResourcePolicy {

  // Whether the resource is currently accepting new access requests.
  bool open_for_requests = 1;

  // The data-sensitivity classification of the resource.
  Sensitivity sensitivity = 2;

  // The people who manage the resource: any one of them may decide its access
  // requests and revoke its grants.
  //
  // A resource always has at least one manager, set when the resource is created.
  //
  repeated access_desk.identity.PersonId manager = 3 [(required) = true, (validate) = true];

  // The access levels the resource offers, ordered from weakest to strongest.
  repeated AccessLevel access_level = 4 [(required) = true, (validate) = true];

  // The longest access grant the resource permits, at one-minute granularity.
  google.protobuf.Duration maximum_duration = 5 [(required) = true];

  // The revision of these rules; increases with every change.
  uint64 policy_version = 6 [(min).value = "1"];
}

// The data-sensitivity classification of a resource.
enum Sensitivity {

  // The unset sensitivity.
  S_UNSPECIFIED = 0;

  // Internal information, the least sensitive class.
  INTERNAL = 1;

  // Restricted information.
  RESTRICTED = 2;

  // Confidential information, the most sensitive class.
  CONFIDENTIAL = 3;
}
