syntax = "proto3";

package access_desk.resources;

import "google/protobuf/descriptor.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.resources";

// Metadata attached to each access level enum value.
message AccessLevelOptions {

  // The relative strength of the level; a higher rank is stronger.
  uint32 rank = 1;

  // The human-readable level name.
  string display_name = 2;
}

extend google.protobuf.EnumValueOptions {

  // Access level metadata attached to enum values.
  //
  // Extension field number 75001 is outside the numbers Spine allocates to its
  // own options and is currently unassigned. It is part of the wire format and
  // MUST remain stable: do not change, reuse, or reassign it.
  //
  AccessLevelOptions access_level = 75001;
}

// A resource-specific access level, ordered by rank for same-or-stronger checks.
enum AccessLevel {

  // The unset access level.
  AL_UNSPECIFIED = 0;

  // Read-only access.
  READ = 1 [(access_level) = {rank: 1, display_name: "Read"}];

  // Read and write access.
  WRITE = 2 [(access_level) = {rank: 2, display_name: "Write"}];

  // Full administrative access.
  ADMIN = 3 [(access_level) = {rank: 3, display_name: "Admin"}];
}
