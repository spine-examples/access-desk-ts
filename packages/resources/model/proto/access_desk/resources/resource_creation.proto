syntax = "proto3";

package access_desk.resources;

import "google/protobuf/duration.proto";
import "access_desk/resources/identifiers.proto";
import "access_desk/resources/access_level.proto";
import "access_desk/resources/values.proto";
import "access_desk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.resources";

// The process of creating a new resource in an organization.
//
// 1. A member requests the resource; if its name is not already taken within the
//    organization, the request is remembered here.
// 2. The resource is created with the requested policy.
// 3. The created resource is recorded among the organization's resources.
// 4. The process is complete.
//
message ResourceCreation {
  option (entity).kind = PROCESS_MANAGER;

  // The resource being brought into existence.
  ResourceId id = 1 [(validate) = true, (set_once) = true];

  // The organization the resource will belong to.
  OrganizationId organization_id = 2 [(validate) = true];

  // The requested resource name.
  string name = 3;

  // The requested resource description.
  string description = 4;

  // The requested resource category.
  string category = 5;

  // The requested data-sensitivity classification.
  Sensitivity sensitivity = 6;

  // The requested access levels.
  repeated AccessLevel access_level = 7;

  // The requested maximum access duration.
  google.protobuf.Duration maximum_duration = 8;

  // The requested resource owner.
  access_desk.identity.PersonId owner = 9;

  // The requested primary approver.
  access_desk.identity.PersonId primary_approver = 10;

  // The requested fallback approver.
  access_desk.identity.PersonId fallback_approver = 11;
}
