syntax = "proto3";

package access_desk.resources;

import "google/protobuf/duration.proto";
import "access_desk/resources/identifiers.proto";
import "access_desk/resources/values.proto";
import "access_desk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.resources";

// Registers a resource in an organization, starting the Resource Registration
// process.
//
// It does not create the resource directly. The process creates the resource and
// records it in the organization, which rejects the recording when the name is
// already used; a rejected recording deletes the created resource. The carried
// policy fields become the resource's complete initial policy.
//
message RegisterResource {

  // The identifier for the resource.
  ResourceId id = 1 [(validate) = true];

  // The organization the resource belongs to.
  OrganizationId organization_id = 2 [(validate) = true];

  // The requested resource display name, unique within the organization and
  // compared case-insensitively.
  string name = 3 [(required) = true];

  // The human-readable resource description.
  string description = 4 [(required) = true];

  // The catalogue category the resource belongs to.
  string category = 5 [(required) = true];

  // The data-sensitivity classification of the resource.
  Sensitivity sensitivity = 6 [(required) = true];

  // The access levels offered by this resource, ordered from weakest to strongest.
  repeated AccessLevel access_level = 7 [(required) = true, (validate) = true];

  // The maximum permitted access duration, at one-minute granularity.
  google.protobuf.Duration maximum_duration = 8 [(required) = true];

  // The resource owner.
  access_desk.identity.PersonId owner = 9 [(required) = true, (validate) = true];

  // The person who operates the resource's live access, revoking and remediating
  // its grants.
  access_desk.identity.PersonId access_administrator = 10 [(required) = true, (validate) = true];

  // The initial primary approver of access requests.
  access_desk.identity.PersonId primary_approver = 11 [(required) = true, (validate) = true];

  // The initial fallback approver, used when the primary is unavailable.
  access_desk.identity.PersonId fallback_approver = 12 [(required) = true, (validate) = true];
}
