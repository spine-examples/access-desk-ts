syntax = "proto3";

package access_desk.access;

import "access_desk/resources/identifiers.proto";
import "access_desk/resources/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.access";

// A resource's access rules used to decide access requests.
//
// Access keeps its own copy, mirrored from the facts the Resources context
// publishes, so deciding a request never has to reach back to Resources.
//
message ResourceRequestPolicy {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // The resource this policy describes.
  access_desk.resources.ResourceId resource = 1 [(validate) = true, (set_once) = true];

  // The complete current resource request policy, as published by Resources.
  access_desk.resources.ResourcePolicy policy = 2 [(required) = true];
}
