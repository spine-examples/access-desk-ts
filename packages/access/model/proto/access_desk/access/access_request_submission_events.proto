syntax = "proto3";
package access_desk.access;

import "access_desk/access/identifiers.proto";
import "access_desk/access/values.proto";
import "access_desk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.access-desk.access";

// A request for access passed the resource rules and has eligible managers who
// may decide it.
message AccessRequestAdmitted {

  // The admitted request.
  AccessRequestId id = 1 [(required) = true, (validate) = true];

  // The immutable request details.
  AccessRequestSnapshot snapshot = 2 [(required) = true];

  // The active resource managers eligible to decide the request.
  repeated access_desk.identity.PersonId candidate_manager = 3 [(required) = true, (validate) = true];
}

// A request was submitted and assigned to its managers for a decision.
message AccessRequestSubmitted {

  // The submitted request.
  AccessRequestId id = 1 [(required) = true, (validate) = true];

  // The immutable request details.
  AccessRequestSnapshot snapshot = 2 [(required) = true];

  // The active resource managers assigned to decide the request.
  repeated access_desk.identity.PersonId candidate_manager = 3 [(required) = true, (validate) = true];
}
