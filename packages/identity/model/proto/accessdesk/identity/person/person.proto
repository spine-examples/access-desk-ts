syntax = "proto3";

package accessdesk.identity.person;

import "accessdesk/identity/identifiers.proto";
import "spine/net/email_address.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// A person who signs in to Access Desk, through any of the accounts they hold
// with identity providers.
message Person {
    option (entity).kind = AGGREGATE;

    // The person's identifier.
    accessdesk.identity.PersonId id = 1;

    // The email address the person was registered under, which their identity
    // provider confirmed.
    spine.net.EmailAddress email_address = 2 [(required) = true];

    // The person's display name when they were registered.
    string name = 3 [(required) = true];

    // The accounts the person signs in with.
    repeated accessdesk.identity.ExternalIdentityId account = 4;
}

// A registered person with every account they sign in with.
message PersonView {
    option (entity).kind = PROJECTION;
    option (entity).visibility = FULL;

    // The person's identifier.
    accessdesk.identity.PersonId id = 1;

    // The email address the person was registered under.
    spine.net.EmailAddress email_address = 2 [(required) = true];

    // The person's display name when they were registered.
    string name = 3 [(required) = true];

    // The accounts the person signs in with.
    repeated accessdesk.identity.ExternalIdentityId account = 4;
}
