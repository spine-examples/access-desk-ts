syntax = "proto3";

package accessdesk.identity.person;

import "accessdesk/identity/identifiers.proto";
import "spine/net/email_address.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// The linking of an account, held with an identity provider such as GitHub or
// Google, to the person who signs in with it.
message ExternalIdentity {
    option (entity).kind = PROCESS_MANAGER;

    // The account with the identity provider.
    accessdesk.identity.ExternalIdentityId id = 1;

    // The email address the provider confirmed for the account.
    spine.net.EmailAddress email_address = 2 [(required) = true];

    // The display name the provider gave for the account.
    string name = 3 [(required) = true];

    // The person the account belongs to, once that is settled.
    accessdesk.identity.PersonId person = 4;
}

// An account with an identity provider and the person who signs in with it.
message ExternalIdentityView {
    option (entity).kind = PROJECTION;
    option (entity).visibility = FULL;

    // The account with the identity provider.
    accessdesk.identity.ExternalIdentityId id = 1;

    // The person who signs in with the account.
    accessdesk.identity.PersonId person = 2 [(required) = true];
}
