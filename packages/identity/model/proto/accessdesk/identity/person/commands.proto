syntax = "proto3";

package accessdesk.identity.person;

import "accessdesk/identity/identifiers.proto";
import "spine/net/email_address.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Registers a person under their email address.
message RegisterPerson {

    // The person's identifier.
    accessdesk.identity.PersonId id = 1;

    // The email address the person is registered under.
    spine.net.EmailAddress email_address = 2 [(required) = true];

    // Who asked for the registration.
    oneof invoker {

        // The account being linked, as somebody signs in with it.
        accessdesk.identity.ExternalIdentityId account = 3;

        // The membership being added.
        accessdesk.identity.MembershipId membership = 4;
    }
}

// Adds to a registered person an account with another identity provider.
message AddSignInAccount {

    // The person who holds the account.
    accessdesk.identity.PersonId id = 1;

    // The account to add.
    accessdesk.identity.ExternalIdentityId account = 2 [(required) = true];

    // The display name the account's provider gives.
    //
    // It becomes the person's name when they have none yet.
    //
    string name = 3;
}

// Makes a person a member of an organization.
message JoinOrganization {

    // The person who joins.
    accessdesk.identity.PersonId id = 1;

    // The membership the person joins through.
    accessdesk.identity.MembershipId membership = 2 [(required) = true];

    // The organization the person joins.
    accessdesk.identity.OrganizationId organization = 3 [(required) = true];
}
