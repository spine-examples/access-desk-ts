syntax = "proto3";

package accessdesk.identity.person;

import "accessdesk/identity/identifiers.proto";
import "spine/net/email_address.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Registers the email address an identity provider confirmed for an account.
message RegisterPersonEmail {

    // The email address.
    spine.net.EmailAddress email_address = 1;

    // The account whose linking asked for the registration.
    accessdesk.identity.ExternalIdentityId invoker = 2 [(required) = true];
}
