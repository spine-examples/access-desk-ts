syntax = "proto3";

package accessdesk.identity.membership;

import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// A person's membership in an organization, under their email address.
//
// An email address belongs to one organization at most, the first to claim
// the person under it as a member.
//
message Membership {
    option (entity).kind = PROCESS_MANAGER;

    // The membership's ID.
    accessdesk.identity.MembershipId id = 1;

    // The organization that claimed the person as a member, or is claiming them.
    accessdesk.identity.OrganizationId organization = 2 [(validate) = true];
}

// A person's membership in an organization, with the email address they were
// claimed under.
message MembershipView {
    option (entity).kind = PROJECTION;
    option (entity).visibility = FULL;

    // The membership's ID.
    accessdesk.identity.MembershipId id = 1;

    // The organization the address belongs to.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];

    // The person the address belongs to.
    accessdesk.identity.PersonId person = 3 [(required) = true];
}
