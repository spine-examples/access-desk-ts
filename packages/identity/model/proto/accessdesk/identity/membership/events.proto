syntax = "proto3";

package accessdesk.identity.membership;

import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// An organization started claiming the person under an email address as a member.
message MemberClaimStarted {

    // The membership's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The organization that claims the person as a member.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];
}

// An organization claimed the person under an email address as a member.
message MemberClaimed {

    // The membership's ID.
    accessdesk.identity.MembershipId id = 1 [(required) = true];

    // The person the address belongs to, who may not have signed in yet.
    accessdesk.identity.PersonId person = 2 [(required) = true];

    // The organization the person belongs to from now on.
    accessdesk.identity.OrganizationId organization = 3 [(required) = true, (validate) = true];
}
