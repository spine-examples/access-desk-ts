syntax = "proto3";

package accessdesk.identity.membership;

import "accessdesk/identity/identifiers.proto";
import "accessdesk/identity/values.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Adds a person to the members of an organization, by their email address.
message AddMember {

    // The membership, which names the email address of the person to add.
    accessdesk.identity.MembershipId id = 1;

    // The organization the person joins.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true];

    // The role the person will hold in the organization.
    accessdesk.identity.OrganizationRole role = 3 [(required) = true];

    // The administrator who adds the person.
    //
    // This field is empty when the person is the organization's first
    // administrator, who counts as adding themselves.
    //
    accessdesk.identity.PersonId added_by = 4;
}
