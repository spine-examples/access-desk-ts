syntax = "proto3";

package accessdesk.identity.membership;

import "accessdesk/identity/identifiers.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Claims the person under an email address as a member of an organization.
//
// The person is registered when nobody has signed in under the address yet.
//
message ClaimMember {

    // The membership's ID.
    accessdesk.identity.MembershipId id = 1;

    // The organization that claims the person as a member.
    accessdesk.identity.OrganizationId organization = 2 [(required) = true, (validate) = true];
}
