syntax = "proto3";

package accessdesk.identity;

// An identity provider people sign in through.
enum IdentityProvider {

    IP_UNSPECIFIED = 0;

    // GitHub.
    //
    // An account is named by the number GitHub gives the user, the
    // `id` of https://docs.github.com/en/rest/users/users#get-the-authenticated-user.
    // The email address is the primary one GitHub has verified, from
    // https://docs.github.com/en/rest/users/emails#list-email-addresses-for-the-authenticated-user.
    //
    GITHUB = 1;

    // Google.
    //
    // An account is named by the `sub` claim of the ID token, and the
    // email address is its `email` claim when `email_verified` is true. See
    // https://developers.google.com/identity/openid-connect/openid-connect#an-id-tokens-payload.
    //
    GOOGLE = 2;
}

// The status of an invitation to join an organization.
enum InvitationStatus {

    IS_UNSPECIFIED = 0;

    // The invitation was issued and waits for the invited person to accept or
    // decline it.
    PENDING = 1;

    // The invited person accepted the invitation and became a member of the
    // organization.
    ACCEPTED = 2;

    // The invited person declined the invitation and did not become a member.
    DECLINED = 3;

    // An administrator took the invitation back before the invited person
    // answered it.
    REVOKED = 4;
}

// What a member may do in an organization, apart from what managing a
// particular resource lets them do.
enum OrganizationRole {

    OR_UNSPECIFIED = 0;

    // May browse the organization's resources and request access to them.
    MEMBER = 1;

    // May do everything a member may, and also invite people, take invitations
    // back, and register resources.
    ADMINISTRATOR = 2;
}
