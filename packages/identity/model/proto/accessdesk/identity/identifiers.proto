syntax = "proto3";

package accessdesk.identity;

import "accessdesk/identity/values.proto";
import "spine/net/email_address.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.accessdesk";

// Identifies a person globally.
message PersonId {

    string uuid = 1 [(required) = true];
}

// Identifies an account a person holds with an identity provider.
message ExternalIdentityId {

    // The identity provider that vouches for the account.
    IdentityProvider provider = 1 [(required) = true];

    // The name the provider gives the account, which never changes for that
    // provider.
    string subject = 2 [(required) = true];
}

// Identifies an organization.
message OrganizationId {

    // The organization's short name, of 1 to 42 lower-case Latin letters,
    // digits, `-`, and `_`, such as `example-com`.
    //
    // It names the organization's database, `accessdesk_resources_<name>`.
    // PostgreSQL allows 63 bytes, the prefix takes 21, and a Latin character
    // takes one. PostgreSQL also lowers the case of a name.
    //
    string value = 1 [
        (required) = true,
        (pattern).regex = "^[a-z0-9_-]{1,42}$",
        (pattern).error_msg = "An organization identifier is 1 to 42 lower-case Latin letters, digits, `-`, and `_`."
    ];
}

// Identifies the membership of one email address in an organization.
message MembershipId {

    // The email address of the member.
    spine.net.EmailAddress email_address = 1 [(required) = true];
}
